<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#EDEEF0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0D0F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Armario Atelier</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <div class="halo" aria-hidden="true"></div>
  <div class="glow-ring" aria-hidden="true"></div>

  <div id="boot" class="boot" aria-live="polite"><div class="boot-mark">A</div></div>

  <!-- ACCESO -->
  <main id="authView" class="auth" hidden>
    <div class="auth-card glass">
      <div class="auth-mark" aria-hidden="true">A</div>
      <h1 class="display" data-t="app.name"></h1>
      <p class="muted" data-t="app.tagline"></p>
      <button class="btn google" type="button" id="googleBtn"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span data-t="auth.google"></span></button>
      <div class="or"><span data-t="auth.or"></span></div>
      <form id="authForm" class="stack" novalidate>
        <label class="field"><span data-t="auth.email"></span><input id="authEmail" type="email" autocomplete="email" required></label>
        <label class="field"><span data-t="auth.password"></span><input id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
        <p class="status" id="authStatus" aria-live="polite"></p>
        <button class="btn primary" type="submit" id="authSubmit" data-t="auth.login"></button>
        <div class="row between small">
          <button class="link" type="button" id="authSwitch" data-t="auth.toSignup"></button>
          <button class="link" type="button" id="authForgot" data-t="auth.forgot"></button>
        </div>
      </form>
    </div>
  </main>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <nav class="nav glass" id="nav" aria-label="Secciones">
      <div class="nav-brand display" data-t="app.name"></div>
      <a href="#/hoy" data-route="hoy" data-icon="today"><span data-t="nav.today"></span></a>
      <a href="#/armario" data-route="armario" data-icon="closet"><span data-t="nav.closet"></span></a>
      <button type="button" class="nav-add" id="addBtn" data-icon="plus" data-t-aria="nav.add"><span data-t="nav.add"></span></button>
      <a href="#/compras" data-route="compras" data-icon="shop"><span data-t="nav.shop"></span></a>
      <a href="#/perfil" data-route="perfil" data-icon="profile"><span data-t="nav.profile"></span></a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="onboarding" class="onb" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
