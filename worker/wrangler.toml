name = "armario-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[vars]
# ID de tu proyecto de Firebase (el mismo que projectId en src/config.js)
FIREBASE_PROJECT_ID = "armario-atelier"
# Tu identificador de usuario (lo ves en la app: Ajustes). Varios, separados por comas.
ALLOWED_UIDS = "gyhrn5U6V7cFslqwDzabTPxEu0w2"
# Si publicas también la versión web en GitHub Pages, añade su dirección aquí
ALLOWED_ORIGINS = "https://localhost,http://localhost:5173,https://pmorenod16.github.io"
# Modelos de Gemini (cámbialos si Google retira alguno: https://ai.google.dev/gemini-api/docs/models)
MODEL_MAIN = "gemini-3.5-flash"
MODEL_FAST = "gemini-3.5-flash"
# Si la búsqueda en tiendas agota el cupo gratuito del modelo principal, se prueba este
MODEL_SEARCH_FALLBACK = "gemini-2.5-flash"

# Reserva sin clave si Gemini falla: IA de Cloudflare (Workers AI, misma cuenta, cupo gratis diario; binding [ai] al final)
CF_VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
CF_TEXT_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
CF_MAX_IMAGES = "4"

# Reserva gratuita si Gemini falla o se agota: NVIDIA (build.nvidia.com)
NVIDIA_VISION_MODEL = "meta/llama-3.2-90b-vision-instruct"
NVIDIA_TEXT_MODEL = "meta/llama-3.3-70b-instruct"
NVIDIA_MAX_IMAGES = "1"

# Las claves NO van aquí. Se guarda como secreto con:
#   npx wrangler secret put GEMINI_API_KEY   (o en el panel de Cloudflare: Settings → Variables and Secrets)
#   npx wrangler secret put NVIDIA_API_KEY   (opcional, reserva)
#   npx wrangler secret put TAVILY_API_KEY   (búsqueda en tiendas gratis: app.tavily.com)

# IA de Cloudflare (Workers AI): reserva sin clave cuando Gemini falla
[ai]
binding = "AI"
