name: Servidor (Cloudflare Worker)

# Sube worker/ a Cloudflare cuando cambia, o a mano con «Run workflow».
# Necesita el secreto CLOUDFLARE_API_TOKEN en GitHub (Settings → Secrets and variables → Actions), creado en Cloudflare
# con la plantilla «Edit Cloudflare Workers». Las claves de Gemini y NVIDIA siguen guardadas en Cloudflare: esto no las toca.
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: ¿Hay clave de Cloudflare?
        id: key
        env: { CF: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          if [ -z "$CF" ]; then echo "Falta el secreto CLOUDFLARE_API_TOKEN: no se sube el servidor."; echo "ok=no" >> "$GITHUB_OUTPUT"; else echo "ok=si" >> "$GITHUB_OUTPUT"; fi
      - if: steps.key.outputs.ok == 'si'
        uses: actions/checkout@v7
      - if: steps.key.outputs.ok == 'si'
        uses: actions/setup-node@v7
        with: { node-version: 22 }
      - if: steps.key.outputs.ok == 'si'
        working-directory: worker
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: npm install --no-audit --no-fund && npx wrangler deploy
