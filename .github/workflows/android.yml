name: APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Crear el proyecto Android
        run: |
          [ -d android ] || npx cap add android
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#25403A' --splashBackgroundColor '#ECEEEA' --splashBackgroundColorDark '#151B19' || echo "Iconos por defecto"
          npx cap sync android

      - name: Firma fija del APK (necesaria para entrar con Google)
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Usando la firma fija del repositorio"
          else
            echo "::warning::Falta el secreto ANDROID_DEBUG_KEYSTORE: entrar con Google no funcionará en este APK"
          fi

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: armario-atelier-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
